name: Deploy MCP documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/public/**
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-main
  cancel-in-progress: true

jobs:
  dispatch:
    name: Request website release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out documentation source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation dependencies
        run: pnpm build

      - name: Validate public documentation
        run: pnpm docs:check

      - name: Verify deployment source
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$SOURCE_REF" != "main" ]]; then
            echo "Documentation deployment only accepts the main branch." >&2
            exit 1
          fi

      - name: Request Fluxmail website release
        env:
          GH_TOKEN: ${{ secrets.FLUXMAIL_DOCS_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "FLUXMAIL_DOCS_DEPLOY_TOKEN is not configured. Add a token with Actions read/write access to fluxmailai/fluxmail-web." >&2
            exit 1
          fi

          gh api \
            --method POST \
            repos/fluxmailai/fluxmail-web/actions/workflows/release.yml/dispatches \
            --field ref=main
          echo "Requested Fluxmail website release with the latest MCP documentation."
